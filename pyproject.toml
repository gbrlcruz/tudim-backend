[project]
name = "tudim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabriela Santos", email = "gabrielasnts30@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.4",
    "black>=26.5.1",
    "fastapi>=0.136.1",
    "google-cloud-pubsub>=2.38.0",
    "google-genai>=2.4.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "sqlalchemy[asyncio]>=2.0.49",
    "twilio>=9.10.9",
    "uvicorn[standard]>=0.47.0",
]

[project.scripts]
tudim = "tudim:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.13",
]
